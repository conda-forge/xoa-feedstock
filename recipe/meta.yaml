{% set name = "xoa" %}
{% set version = "2026.11.0" %}
{% set python_min = "3.10.*" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/xoa-{{ version }}.tar.gz
  sha256: 2e5e0722c04f6605973951f7c7d5bd66a4b363a147bcdd66a08f421cbbaf39f3

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools >=64
    - setuptools-scm >=8
  run:
    - cartopy
    - cmocean
    - configobj
    - dask-core
    - gsw
    - matplotlib-base
    - netcdf4
    - numba
    - platformdirs
    - pooch
    - python >={{ python_min }}
    - scipy
    - xarray >=2024.6

test:
  source_files:
    - tests/*
  imports:
    - xoa
  commands:
    - pip check
#    - xoa info
    - pytest tests
  requires:
    - pip
    - pytest
    - python {{ python_min }}

about:
  home: https://github.com/shom-fr/xoa
  summary: xarray-based ocean analysis library
  license: Apache-2.0
  license_file: LICENSE
  description: |
    xoa is intended to help reading and manipulating observed and
    simulated ocean data. It is heavily based on xarray.
  doc_url: https://xoa.readthedocs.io/
  dev_url: https://github.com/shom-fr/xoa

extra:
  recipe-maintainers:
    - stefraynaud
    - mmorvan
